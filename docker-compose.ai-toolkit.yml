version: "3.8"

services:
  train:
    image: nvcr.io/nvidia/pytorch:25.12-py3
    container_name: ai-toolkit-training
    working_dir: /workspace/ai-toolkit
    volumes:
      # AI Toolkit code
      - ./:/workspace/ai-toolkit
      # HuggingFace cache for model downloads
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Dataset (set DATASET_PATH env var or default to ./dataset)
      - ${DATASET_PATH:-./dataset}:/workspace/dataset
      # Local model checkpoints (ComfyUI's krea2 bf16 checkpoints, reference key naming)
      - /home/chris/ComfyUI/models/diffusion_models:/workspace/models:ro
      # Whole ComfyUI models tree as MODELS_PATH (flux3 resolves vae/ and text_encoders/ there)
      - /home/chris/ComfyUI/models:/workspace/comfy_models:ro
      # Output
      - ./output:/workspace/ai-toolkit/output
      # Same paths as the host, so configs written by the UI (absolute host paths for
      # datasets, output, sqlite db, ComfyUI models) resolve unchanged in here.
      - ./:/home/chris/projects/ai-toolkit-flux3
      - /home/chris/ComfyUI/models:/home/chris/ComfyUI/models:ro
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: '16gb'
    environment:
      - HF_HOME=/root/.cache/huggingface
      - MODELS_PATH=/workspace/comfy_models
      # GB10 unified-pool fragmentation guard (step1x precedent; pilot OOM 08-06)
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,garbage_collection_threshold:0.8
      - TORCH_CUDA_ARCH_LIST=10.0
      # Cap CPU thread pools: on the 20-core Grace box the training-loop startup
      # was spinning 63 threads at 100%% CPU / 0%% GPU and never reaching step 1.
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - OPENBLAS_NUM_THREADS=8
      - NUMEXPR_NUM_THREADS=8
      - TOKENIZERS_PARALLELISM=false
      # UI job plumbing (ui_job_status.py); left unset for CLI runs, which is what
      # tells the trainer it is not a UI job.
      - AITK_JOB_ID
      - IS_AI_TOOLKIT_UI
      - HF_TOKEN
    cap_add:
      - SYS_PTRACE          # allow py-spy to dump the stack if it still hangs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
        set -e &&
        apt-get update && apt-get install -y libgl1 libglib2.0-0t64 libopenblas-dev --no-install-recommends &&
        pip install -q -r requirements_nodeps.txt &&
        set +e;
        python run.py ${CONFIG_FILE:-config/train_config.yaml};
        rc=$$?;
        chown -R 1000:1000 /workspace/ai-toolkit/output /workspace/ai-toolkit/aitk_db.db* 2>/dev/null;
        exit $$rc
      "
    tty: true
    stdin_open: true

  ui:
    image: node:22-slim
    container_name: ai-toolkit-ui
    working_dir: /app
    volumes:
      # UI code
      - ./ui:/app
      # AI Toolkit root (for configs, output, etc.)
      - ./:/workspace/ai-toolkit
      # Persist node_modules
      - ai-toolkit-ui-node-modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      - TOOLKIT_PATH=/workspace/ai-toolkit
      - TOOLKIT_ROOT=/workspace/ai-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      bash -c "
        apt-get update && apt-get install -y openssl python3 make g++ --no-install-recommends &&
        npm install &&
        npx prisma generate &&
        npx prisma db push &&
        npm run dev
      "
    tty: true
    stdin_open: true

volumes:
  ai-toolkit-ui-node-modules:
